engineStrict: true

overrides:
  "@modelcontextprotocol/sdk@<1.31.0": 1.32.1
  tinypool@2.1.0: 2.1.2
  "@opentelemetry/core@<2.8.0": 2.11.0
  "@opentelemetry/instrumentation-pg@<0.73.0": 0.73.0
  "@opentelemetry/instrumentation-mysql2@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-mysql@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-mongoose@<0.67.0": 0.67.0
  "@opentelemetry/instrumentation-knex@<0.65.0": 0.65.0
  "@opentelemetry/instrumentation-tedious@<0.40.0": 0.40.0
  browserslist: 4.28.7
  minimatch@3>brace-expansion: 5.0.12
  minimatch@10>brace-expansion: 5.0.12
  fast-uri: 4.2.1
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  postcss-selector-parser@>=7.1.0 <7.1.3: 7.1.6
  sharp: 0.35.5
  ws: ">=8.21.0"
  "zod@<4.6.6": 4.6.6
  "body-parser@>=2.0.0 <2.4.0": 2.4.0

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: false
  unrs-resolver: false

auditConfig:
  ignoreGhsas:
    # braces は修正版が未公開（2026-10-03 時点の最新は 3.0.3）。Panda と eslint-config-next の
    # fast-glob 経由でビルド時に使われ、展開する glob はリポジトリ内の設定値だけなので外部入力は届かない。
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - nodemailer@10.0.13
