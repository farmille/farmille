  minimatch@10>brace-expansion: 5.0.9
  fast-uri: 4.1.2
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.3
  ws: ">=8.21.0"

patchedDependencies:
