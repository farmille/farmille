overrides:
  browserslist: 4.28.7
  minimatch@3>brace-expansion: 5.0.12
  minimatch@10>brace-expansion: 5.0.12
  fast-uri: 4.2.1
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.4
  ws: ">=8.21.0"

patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: false
  unrs-resolver: false

auditConfig:
  # image-size@2.0.2 はローカルパッチと check:security-patches で対策を検証する。
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # braces は修正版が未公開（2026-10-03 時点の最新は 3.0.3）。Panda と eslint-config-next の
    # fast-glob 経由でビルド時に使われ、展開する glob はリポジトリ内の設定値だけなので外部入力は届かない。
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - nodemailer@10.0.13
  - "@e2e-dev/web@0.12.0"
  - e2e@0.17.0
