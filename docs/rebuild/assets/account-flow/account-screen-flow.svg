<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3600" height="2160" viewBox="0 0 3600 2160" role="img" aria-labelledby="title desc">
  <title id="title">Farmille アカウント別画面遷移図</title>
  <desc id="desc">ホームから登録方法を選び、一般ユーザーとメーカー・出品者に分岐する。メーカー・出品者は運営審査を経てからログインできる。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e231f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#245f8f"/>
    </marker>
    <marker id="arrow-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#a65d00"/>
    </marker>

    <clipPath id="clip-home"><rect x="60" y="314" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-choice"><rect x="420" y="314" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-general-signup"><rect x="860" y="314" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-general-done"><rect x="1220" y="314" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-general-login"><rect x="1740" y="314" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-mypage"><rect x="2100" y="314" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-seller-apply"><rect x="860" y="1284" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-seller-done"><rect x="1220" y="1284" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-admin-list"><rect x="1600" y="1414" width="480" height="338" rx="0"/></clipPath>
    <clipPath id="clip-admin-detail"><rect x="2170" y="1284" width="480" height="451" rx="0"/></clipPath>
    <clipPath id="clip-seller-login"><rect x="2800" y="1284" width="250" height="541" rx="0"/></clipPath>
    <clipPath id="clip-dashboard"><rect x="3160" y="1284" width="250" height="541" rx="0"/></clipPath>

    <style>
      text { font-family: "Noto Sans CJK JP", sans-serif; }
      .title { font-size: 56px; font-weight: 800; fill: #1e231f; }
      .subtitle { font-size: 25px; font-weight: 400; fill: #59605b; }
      .lane-title { font-size: 30px; font-weight: 800; }
      .route { font-family: monospace; font-size: 22px; font-weight: 800; fill: #1e231f; }
      .screen-name { font-size: 21px; font-weight: 700; fill: #59605b; }
      .arrow-label { font-size: 21px; font-weight: 700; fill: #303632; paint-order: stroke; stroke: #f8f8f5; stroke-width: 9px; stroke-linejoin: round; }
      .note-title { font-size: 25px; font-weight: 800; fill: #1e231f; }
      .note { font-size: 21px; font-weight: 500; fill: #4c534d; }
      .chip { font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <rect width="3600" height="2160" fill="#f8f8f5"/>

  <text class="title" x="60" y="82">Farmille アカウント別画面遷移図</text>
  <text class="subtitle" x="60" y="127">現行実装の実画面を使用。実線は新規作成、破線は登録済みアカウントの入口を示す。</text>

  <rect x="60" y="157" width="179" height="48" rx="24" fill="#e7ece8"/>
  <text class="chip" x="149" y="189" text-anchor="middle" fill="#384039">共通・公開</text>
  <rect x="253" y="157" width="238" height="48" rx="24" fill="#e8f5e9"/>
  <text class="chip" x="372" y="189" text-anchor="middle" fill="#1b5e20">一般ユーザー</text>
  <rect x="505" y="157" width="280" height="48" rx="24" fill="#eaf2f9"/>
  <text class="chip" x="645" y="189" text-anchor="middle" fill="#245f8f">メーカー・出品者</text>
  <rect x="799" y="157" width="182" height="48" rx="24" fill="#fff4e0"/>
  <text class="chip" x="890" y="189" text-anchor="middle" fill="#8b4e00">運営</text>

  <rect x="760" y="222" width="1780" height="700" rx="34" fill="#f0f8f1" stroke="#b9dabb" stroke-width="3"/>
  <rect x="1485" y="856" width="312" height="50" rx="25" fill="#2e7d32"/>
  <text class="lane-title" x="1641" y="891" text-anchor="middle" fill="#ffffff">一般ユーザー（個人用）</text>

  <rect x="760" y="1120" width="2780" height="765" rx="34" fill="#f0f6fb" stroke="#b7cee0" stroke-width="3"/>
  <rect x="786" y="1140" width="398" height="54" rx="27" fill="#245f8f"/>
  <text class="lane-title" x="985" y="1177" text-anchor="middle" fill="#ffffff">メーカー・出品者（組織用）</text>

  <rect x="1548" y="1205" width="1155" height="622" rx="30" fill="#fffaf0" stroke="#e4bd84" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="1580" y="1225" width="286" height="50" rx="25" fill="#a65d00"/>
  <text class="lane-title" x="1723" y="1260" text-anchor="middle" fill="#ffffff">運営（AAL2必須）</text>

  <!-- arrows: common and general -->
  <path d="M310 590 H420" fill="none" stroke="#59605b" stroke-width="7" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="365" y="563" text-anchor="middle">登録CTA</text>

  <path d="M670 500 H860" fill="none" stroke="#2e7d32" stroke-width="8" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="765" y="472" text-anchor="middle">個人用・新規</text>

  <path d="M1110 590 H1220" fill="none" stroke="#2e7d32" stroke-width="8" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="1165" y="563" text-anchor="middle">登録</text>

  <path d="M1345 855 V995 H185 V855" fill="none" stroke="#2e7d32" stroke-width="7" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="770" y="1026" text-anchor="middle">ホームへ戻る</text>

  <path d="M545 250 V218 H1865 V250" fill="none" stroke="#2e7d32" stroke-width="7" stroke-dasharray="17 14" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="1540" y="242" text-anchor="middle">一般ユーザー登録済み</text>

  <path d="M1990 590 H2100" fill="none" stroke="#2e7d32" stroke-width="8" marker-end="url(#arrow-green)"/>
  <text class="arrow-label" x="2045" y="563" text-anchor="middle">ログイン</text>

  <!-- arrows: seller and admin -->
  <path d="M545 855 V1555 H860" fill="none" stroke="#245f8f" stroke-width="8" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="705" y="1524" text-anchor="middle">組織用・新規申請</text>

  <path d="M1110 1555 H1220" fill="none" stroke="#245f8f" stroke-width="8" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="1165" y="1527" text-anchor="middle">申請</text>

  <path d="M1470 1555 H1600" fill="none" stroke="#a65d00" stroke-width="8" marker-end="url(#arrow-amber)"/>
  <text class="arrow-label" x="1535" y="1527" text-anchor="middle">運営へ</text>

  <path d="M2080 1583 H2170" fill="none" stroke="#a65d00" stroke-width="8" marker-end="url(#arrow-amber)"/>
  <text class="arrow-label" x="2125" y="1555" text-anchor="middle">詳細確認</text>

  <path d="M2650 1515 H2800" fill="none" stroke="#245f8f" stroke-width="8" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="2725" y="1487" text-anchor="middle">承認</text>

  <path d="M3050 1555 H3160" fill="none" stroke="#245f8f" stroke-width="8" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="3105" y="1527" text-anchor="middle">ログイン</text>

  <path d="M670 755 C875 1080, 2550 1030, 2925 1220" fill="none" stroke="#245f8f" stroke-width="7" stroke-dasharray="17 14" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label" x="2480" y="1082" text-anchor="middle">承認済み・登録済み</text>

  <rect x="1845" y="1140" width="670" height="60" rx="18" fill="#fff4e0" stroke="#d59a47" stroke-width="2"/>
  <text class="note" x="2180" y="1178" text-anchor="middle">運用発行の admin → /login → /admin/mfa → 出品者審査</text>
  <path d="M2178 1200 V1250" fill="none" stroke="#a65d00" stroke-width="6" marker-end="url(#arrow-amber)"/>

  <path d="M2410 1735 V1800 H2650" fill="none" stroke="#b33b30" stroke-width="6"/>
  <rect x="2500" y="1772" width="230" height="50" rx="25" fill="#fff0ee" stroke="#d86e64" stroke-width="2"/>
  <text class="chip" x="2615" y="1805" text-anchor="middle" fill="#9d2e25">却下／凍結</text>

  <!-- screen frames: common and general -->
  <g filter="url(#shadow)">
    <rect x="60" y="250" width="250" height="610" rx="22" fill="#ffffff" stroke="#d8d6cd" stroke-width="3"/>
    <text class="route" x="80" y="282">/</text>
    <text class="screen-name" x="80" y="305">ホーム</text>
    <image x="60" y="314" width="250" height="541" xlink:href="screens/08-home.png" clip-path="url(#clip-home)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="250" width="250" height="610" rx="22" fill="#ffffff" stroke="#809086" stroke-width="4"/>
    <text class="route" x="440" y="282">/signup</text>
    <text class="screen-name" x="440" y="305">登録方法選択</text>
    <image x="420" y="314" width="250" height="541" xlink:href="screens/01-account-choice.png" clip-path="url(#clip-choice)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="250" width="250" height="610" rx="22" fill="#ffffff" stroke="#8fc492" stroke-width="4"/>
    <text class="route" x="880" y="282">/signup/general</text>
    <text class="screen-name" x="880" y="305">一般登録</text>
    <image x="860" y="314" width="250" height="541" xlink:href="screens/02-general-signup.png" clip-path="url(#clip-general-signup)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1220" y="250" width="250" height="610" rx="22" fill="#ffffff" stroke="#8fc492" stroke-width="4"/>
    <text class="route" x="1240" y="282">/signup/done</text>
    <text class="screen-name" x="1240" y="305">登録完了</text>
    <image x="1220" y="314" width="250" height="541" xlink:href="screens/07-general-signup-done.png" clip-path="url(#clip-general-done)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1740" y="250" width="250" height="610" rx="22" fill="#ffffff" stroke="#8fc492" stroke-width="4"/>
    <text class="route" x="1760" y="282">/login</text>
    <text class="screen-name" x="1760" y="305">一般ログイン</text>
    <image x="1740" y="314" width="250" height="541" xlink:href="screens/06-general-login.png" clip-path="url(#clip-general-login)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="2100" y="250" width="250" height="610" rx="22" fill="#ffffff" stroke="#8fc492" stroke-width="4"/>
    <text class="route" x="2120" y="282">/me</text>
    <text class="screen-name" x="2120" y="305">マイページ</text>
    <image x="2100" y="314" width="250" height="541" xlink:href="screens/09-mypage.png" clip-path="url(#clip-mypage)" preserveAspectRatio="xMidYMin slice"/>
  </g>

  <!-- screen frames: seller and admin -->
  <g filter="url(#shadow)">
    <rect x="860" y="1220" width="250" height="610" rx="22" fill="#ffffff" stroke="#7daaca" stroke-width="4"/>
    <text class="route" x="880" y="1252">/sellers/apply</text>
    <text class="screen-name" x="880" y="1275">組織申請</text>
    <image x="860" y="1284" width="250" height="541" xlink:href="screens/03-seller-apply.png" clip-path="url(#clip-seller-apply)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1220" y="1220" width="250" height="610" rx="22" fill="#ffffff" stroke="#7daaca" stroke-width="4"/>
    <text class="route" x="1240" y="1252">/sellers/apply/done</text>
    <text class="screen-name" x="1240" y="1275">受付完了</text>
    <image x="1220" y="1284" width="250" height="541" xlink:href="screens/04-seller-apply-done.png" clip-path="url(#clip-seller-done)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1600" y="1350" width="480" height="407" rx="22" fill="#ffffff" stroke="#d9a153" stroke-width="4"/>
    <text class="route" x="1620" y="1382">/admin/sellers</text>
    <text class="screen-name" x="1620" y="1406">申請一覧</text>
    <image x="1600" y="1414" width="480" height="338" xlink:href="screens/11-admin-sellers-list.png" clip-path="url(#clip-admin-list)" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="2170" y="1220" width="480" height="520" rx="22" fill="#ffffff" stroke="#d9a153" stroke-width="4"/>
    <text class="route" x="2190" y="1252">/admin/sellers/[id]</text>
    <text class="screen-name" x="2190" y="1275">審査詳細</text>
    <image x="2170" y="1284" width="480" height="451" xlink:href="screens/12-admin-seller-detail.png" clip-path="url(#clip-admin-detail)" preserveAspectRatio="xMidYMin meet"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="2800" y="1220" width="250" height="610" rx="22" fill="#ffffff" stroke="#7daaca" stroke-width="4"/>
    <text class="route" x="2820" y="1252">/sellers/login</text>
    <text class="screen-name" x="2820" y="1275">出品者ログイン</text>
    <image x="2800" y="1284" width="250" height="541" xlink:href="screens/05-seller-login.png" clip-path="url(#clip-seller-login)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="3160" y="1220" width="250" height="610" rx="22" fill="#ffffff" stroke="#7daaca" stroke-width="4"/>
    <text class="route" x="3180" y="1252">/dashboard</text>
    <text class="screen-name" x="3180" y="1275">出品者ホーム</text>
    <image x="3160" y="1284" width="250" height="541" xlink:href="screens/10-dashboard.png" clip-path="url(#clip-dashboard)" preserveAspectRatio="xMidYMin meet"/>
  </g>

  <rect x="60" y="1945" width="3480" height="150" rx="26" fill="#ffffff" stroke="#d8d6cd" stroke-width="3"/>
  <text class="note-title" x="90" y="1992">アカウント種別の境界</text>
  <text class="note" x="90" y="2034">一般登録の「メーカー関係者」は個人プロフィールの非公開属性であり、組織用の出品者権限は付与されない。</text>
  <text class="note" x="90" y="2072">メーカー・出品者は申請時にパスワードを受け付けず、運営の承認とログイン情報発行後に初めて /dashboard を利用できる。</text>
</svg>
