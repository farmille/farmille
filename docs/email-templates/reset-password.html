<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farmille - パスワード再設定</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F5F5F4;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:#1F2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F5F5F4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#FFFFFF;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background-color:#3A7F5C;padding:24px 32px;color:#FFFFFF;font-size:24px;font-weight:700;letter-spacing:-0.5px;">
                Farmille
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-size:20px;font-weight:700;color:#1F2937;">
                  パスワードの再設定
                </h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#374151;">
                  Farmille のパスワード再設定リクエストを受け付けました。<br />
                  下のボタンから新しいパスワードを設定してください。
                </p>
                <p style="margin:24px 0;text-align:center;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#3A7F5C;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;padding:12px 28px;border-radius:6px;">
                    パスワードを再設定する
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#6B7280;">
                  ボタンが押せない場合は、以下の URL をブラウザに貼り付けてアクセスしてください。
                </p>
                <p style="margin:0 0 16px;font-size:12px;line-height:1.5;color:#3A7F5C;word-break:break-all;">
                  {{ .ConfirmationURL }}
                </p>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6B7280;">
                  パスワード再設定をリクエストしていない場合は、このメールを破棄してください。アカウントの安全のため、心当たりのない通知が続く場合は Farmille サポートまでご連絡ください。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px;border-top:1px solid #E5E7EB;font-size:12px;color:#9CA3AF;">
                Farmille チーム<br />
                BS資材の農家レビュープラットフォーム
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
