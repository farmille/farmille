<!--
  Farmille パスワードリセット メールテンプレート (日本語)
  貼り付け先: Supabase Dashboard → Authentication → Email Templates → "Reset Password"
  使える変数: {{ .ConfirmationURL }} (リセットリンク), {{ .SiteURL }}, {{ .Email }}
  ※ メールクライアントは <style>/外部CSS/SVG をほぼ無視するため、table レイアウト + inline CSS で書いている。
  ※ ロゴ画像を出したい場合は <img src="https://farmille.com/icon.png"> 等、公開URLの PNG を使う (SVG は不可)。
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5;margin:0;padding:24px 0;font-family:-apple-system,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e9e7;">
        <!-- ヘッダー (ブランド緑) -->
        <tr>
          <td style="background:#1e5c3a;padding:24px 32px;">
            <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.5px;">🌱 Farmille</span>
          </td>
        </tr>
        <!-- 本文 -->
        <tr>
          <td style="padding:32px;">
            <h1 style="margin:0 0 16px;font-size:20px;color:#1a1a1a;">パスワードの再設定</h1>
            <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#444;">
              Farmille のアカウント（{{ .Email }}）でパスワード再設定のリクエストを受け付けました。
              下のボタンから新しいパスワードを設定してください。
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
              <tr>
                <td align="center" style="border-radius:9999px;background:#2d7a4f;">
                  <a href="{{ .ConfirmationURL }}" target="_blank"
                     style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:9999px;">
                    パスワードを再設定する
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#888;">
              ボタンが押せない場合は、以下のURLをブラウザに貼り付けてください：
            </p>
            <p style="margin:0 0 24px;font-size:12px;line-height:1.5;word-break:break-all;">
              <a href="{{ .ConfirmationURL }}" style="color:#2d7a4f;">{{ .ConfirmationURL }}</a>
            </p>
            <p style="margin:0;font-size:13px;line-height:1.6;color:#888;border-top:1px solid #eee;padding-top:16px;">
              このリンクは一定時間で失効します。心当たりがない場合は、このメールを破棄していただいて問題ありません
              （パスワードは変更されません）。
            </p>
          </td>
        </tr>
        <!-- フッター -->
        <tr>
          <td style="background:#f4f6f5;padding:20px 32px;text-align:center;">
            <p style="margin:0;font-size:12px;color:#999;">
              BS資材の農家レビュー — Farmille<br>
              <a href="{{ .SiteURL }}" style="color:#2d7a4f;text-decoration:none;">farmille.com</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
