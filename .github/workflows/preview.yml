name: Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number
        required: true
        type: string
      database:
        description: Use branch for migrations or isolated testing
        required: true
        default: auto
        type: choice
        options: [auto, shared, branch]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: farmille-preview-pr-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
      DB_MODE: ${{ inputs.database || 'auto' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Validate pull request
        id: pr
        run: bash trusted/tools/ci/preview.sh prepare

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: trusted/.node-version

      - name: Install deployment tools
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-tools" supabase@2.120.0
          echo "$RUNNER_TEMP/preview-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prepare database and deploy preview
        run: bash trusted/tools/ci/preview.sh deploy
        env:
          PR_SHA: ${{ steps.pr.outputs.sha }}
          DB_MODE: ${{ steps.pr.outputs.database }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
