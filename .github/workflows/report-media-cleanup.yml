name: Remove expired report media

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmille-report-media-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [chgrudbattvmcjxhaskh, sajxnypkbybuzsqdguaa]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove unreferenced images older than 24 hours
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?}"
          keys=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")
          secret=$(jq -er '.[] | select(.name == "service_role") | .api_key' <<<"$keys")
          echo "::add-mask::$secret"
          export NEXT_PUBLIC_SUPABASE_URL="https://$PROJECT_REF.supabase.co" SUPABASE_SECRET_KEY="$secret"
          unset SUPABASE_ACCESS_TOKEN keys secret
          node src/server/cleanup-report-media.ts
