name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

# PR は最新コミットの検査だけを残す。main は実行中の本番移行を止めず、待機分を最新にまとめる。
concurrency:
  group: farmille-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Application quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high severity vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Check Story coverage
        run: pnpm check:stories

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
        env:
          # CI 用の公開ダミー値。コード側にフォールバックは置かない方針のため CI 設定で与える。
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

  database:
    name: Database authorization
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_EMAIL_HOOK_SECRET: "v1,whsec_bG9jYWwtZmFybWlsbGUtZW1haWwtaG9vay10ZXN0LWtleQ=="
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Start local Supabase
        run: npx --yes supabase@2.120.0 start -x studio,edge-runtime,realtime,imgproxy,logflare,vector

      - name: Test database authorization
        run: npx --yes supabase@2.120.0 test db

  production:
    name: Migrate and deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: farmille-production
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_ID: sajxnypkbybuzsqdguaa
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject an outdated production run
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "::error::main has advanced. Deploy its latest successful CI run."
            exit 1
          }

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Apply shared development migrations
        env:
          SUPABASE_PROJECT_ID: chgrudbattvmcjxhaskh
        run: npx --yes supabase@2.120.0 db push --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes

      - name: Apply production migrations
        run: npx --yes supabase@2.120.0 db push --project-ref "$SUPABASE_PROJECT_ID" --skip-vault --yes

      - name: Deploy production
        run: bash tools/ci/deploy.sh "$GITHUB_SHA" production
        env:
          GH_TOKEN: ${{ github.token }}
