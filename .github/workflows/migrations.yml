name: Migration check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

# このDBはrunner内だけで使うため、新しいコミットが来たら古い検査を止める。
concurrency:
  group: farmille-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  order:
    name: Migration order
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # main に migration が入ると migration-recheck.yml がこのジョブを再実行する。再実行でも main の最新と比べる。
      - name: Fetch latest main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Check migration order
        run: bash tools/ci/check-migration-order.sh origin/main

  migration:
    name: Reset local Supabase database
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Start local Supabase
        run: npx --yes supabase@latest start

      - name: Reset local Supabase database
        run: npx --yes supabase@latest db reset
