name: Migration check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  migration:
    name: Reset local Supabase database
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Start local Supabase
        run: npx --yes supabase@latest start

      - name: Reset local Supabase database
        run: npx --yes supabase@latest db reset
